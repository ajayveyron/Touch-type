<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Variable Font</title>
    <!-- Load MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
    <!-- Load TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <!-- Load the MediaPipe camera utilities -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <!-- Load the MediaPipe drawing utilities -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100..900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "Roboto Flex", sans-serif;
        color: white;
        overflow: hidden;
      }

      .camera-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }

      #webcam,
      #overlayCanvas {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #webcam {
        transform: scaleX(-1);
      }

      #overlayCanvas {
        transform: scaleX(-1);
      }

      .content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 2rem;
      }

      #variableFontText {
        font-size: 6rem;
        text-align: center;
        margin-bottom: 2rem;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
      }

      .instructions {
        position: absolute;
        left: 2rem;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 0, 0.6);
        padding: 1.5rem;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        max-width: 400px;
      }

      .instructions h2 {
        margin-bottom: 1rem;
        font-size: 1.5rem;
      }

      .instructions ol {
        margin-left: 1.5rem;
        line-height: 1.6;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at center,
          transparent 0%,
          rgba(0, 0, 0, 0.5) 100%
        );
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="camera-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="overlay"></div>

    <div class="content">
      <div id="variableFontText">Live Variable font</div>

      <div class="instructions">
        <h2>Instructions</h2>
        <ol>
          <li>Position your hand in front of the camera</li>
          <li>Make sure your hand is well-lit and visible</li>
          <li>Move your thumb and index finger to control font weight</li>
          <li>Watch the text above respond to your gestures</li>
        </ol>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
